name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-product-checks:
    name: Windows / Python 3.12 / Node 24
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-test.txt

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            chrome-extension/package-lock.json

      - name: Install minimal Python test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt

      - name: Check Python dependency compatibility
        run: python -m pip check

      - name: Run API and algorithm contract tests
        run: python -m pytest src/hyh/tests src/lsj/tests -q

      - name: Run extension tests
        run: node --test chrome-extension/tests/*.test.cjs

      - name: Install extension browser test tools
        working-directory: chrome-extension
        run: npm ci

      - name: Install isolated Chromium test browser
        working-directory: chrome-extension
        run: npx playwright install chromium --no-shell

      - name: Verify extension and API with synthetic pages
        working-directory: chrome-extension
        run: npm run test:e2e

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build
