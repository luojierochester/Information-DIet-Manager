name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-product-checks:
    name: Windows / Python 3.12 / Node 24
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-test.txt

      - name: Reject tracked runtime data and local dependencies
        run: python scripts/check_repository_hygiene.py

      - name: Verify repository gate using temporary Git repositories
        run: python -m unittest discover -s scripts/tests -p test_repository_hygiene.py -v

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            chrome-extension/package-lock.json

      - name: Install minimal Python test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt

      - name: Check Python dependency compatibility
        run: python -m pip check

      - name: Install pinned Python audit tool in an isolated environment
        shell: pwsh
        run: |
          $pythonAuditEnv = Join-Path $env:RUNNER_TEMP 'idm-python-audit'
          python -m venv $pythonAuditEnv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Join-Path $pythonAuditEnv 'Scripts/python.exe') -m pip install --disable-pip-version-check --index-url https://pypi.org/simple pip-audit==2.10.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Audit the complete minimal Python dependency tree
        shell: pwsh
        run: |
          $pythonAudit = Join-Path $env:RUNNER_TEMP 'idm-python-audit/Scripts/python.exe'
          & $pythonAudit -m pip_audit --strict -r requirements-test.txt --index-url https://pypi.org/simple --vulnerability-service pypi --progress-spinner off --format json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run API and algorithm contract tests
        run: python -m pytest src/hyh/tests src/lsj/tests -q

      - name: Run extension tests
        run: node --test chrome-extension/tests/*.test.cjs

      - name: Install extension browser test tools
        working-directory: chrome-extension
        run: npm ci

      - name: Audit all extension dependencies against the official registry
        working-directory: chrome-extension
        run: npm audit --package-lock-only --include=dev --include=optional --include=peer --audit-level=low --registry=https://registry.npmjs.org

      - name: Install isolated Chromium test browser
        working-directory: chrome-extension
        run: npx playwright install chromium --no-shell

      - name: Verify extension and API with synthetic pages
        working-directory: chrome-extension
        run: npm run test:e2e

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit all frontend dependencies against the official registry
        working-directory: frontend
        run: npm audit --package-lock-only --include=dev --include=optional --include=peer --audit-level=low --registry=https://registry.npmjs.org

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Verify authenticated UI and data recovery
        working-directory: frontend
        run: npm run test:e2e
